name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            mcp-server/pyproject.toml
            gui-backend/pyproject.toml
      - name: Install
        run: pip install -e "mcp-server[dev]" -e "gui-backend[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check
        run: |
          (cd mcp-server && mypy)
          (cd gui-backend && mypy)
      # The integration tests start a real Postgres with testcontainers, so they need Docker,
      # which the hosted runners have.
      - name: Test
        run: pytest -q

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui-frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  images:
    name: Build images
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: The compose file is valid
        run: docker compose --env-file .env.example config --quiet
      - name: mcp-server
        run: docker build -f mcp-server/Dockerfile -t mcp-sql-server .
      - name: gui-backend
        run: docker build -f gui-backend/Dockerfile -t mcp-sql-gui-backend .
      - name: gui-frontend
        run: docker build -t mcp-sql-gui-frontend gui-frontend
      - name: setup jobs (migrations, identity provider)
        run: docker build -f deploy/setup.Dockerfile -t mcp-sql-setup .
