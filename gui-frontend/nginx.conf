server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Written at container start from OIDC_AUTHORITY / OIDC_CLIENT_ID; never cached.
    location = /config.js {
        alias /tmp/config.js;
        add_header Cache-Control "no-store";
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # Hashed build output can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: any other path is a client-side route.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
