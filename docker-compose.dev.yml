# Local development infrastructure only: Postgres and Redis.
# The services themselves run on the host during development; the full
# stack lives in docker-compose.yml.
#
#   docker compose -f docker-compose.dev.yml --env-file .env up -d
name: mcp-sql-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Consumed by db/init/01-create-roles-and-databases.sh
      META_OWNER_PASSWORD: ${META_OWNER_PASSWORD:?set META_OWNER_PASSWORD in .env}
      MCP_APP_PASSWORD: ${MCP_APP_PASSWORD:?set MCP_APP_PASSWORD in .env}
      GUI_APP_PASSWORD: ${GUI_APP_PASSWORD:?set GUI_APP_PASSWORD in .env}
      ORG_OWNER_PASSWORD: ${ORG_OWNER_PASSWORD:?set ORG_OWNER_PASSWORD in .env}
      ORG_READONLY_PASSWORD: ${ORG_READONLY_PASSWORD:?set ORG_READONLY_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/sample_data:/sample_data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
